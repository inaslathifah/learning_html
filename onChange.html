<!-- change = jika ada perubahan terhadap element, seperti select dan input -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Event Change</title>
</head>

<body>
    <h2>Daftar Peserta Pelatihan</h2>
    <label for="">Filter Berdasarkan Jurusan</label>
    <select name="" id="filterJurusan">
        <option value="semua">Pilih Semua</option>
        <option value="web">Web Developer</option>
        <option value="net">Network Engineer</option>
        <option value="tekom">Teknik Komputer</option>
        <option value="mobile">Mobile Apps</option>
    </select>

    <label for="">Cari Siswa</label>
    <input type="text" id="cariSiswa" placeholder="Cari Peserta">
    <br>

    <ul id="listSiswa"></ul>

    <script>
        const peserta = [
            {
                id: 1, nama: "Kokom", jurusan: "web",
            },
            {
                id: 2, nama: "Kiki", jurusan: "net",
            },
            {
                id: 3, nama: "Tuku", jurusan: "tekom",
            },
            {
                id: 4, nama: "Keke", jurusan: "mobile",
            },
            {
                id: 5, nama: "Lala", jurusan: "web",
            },
        ]

        const listSiswa = document.getElementById('listSiswa')
        const filterJurusan = document.getElementById('filterJurusan')
        const cariSiswa = document.getElementById('cariSiswa')

        function getSiswa(dataSiswa) {
            listSiswa.innerHTML = "" // ini dibuat diawal agar tidak kosong, biar tidak ada looping 
            dataSiswa.forEach((a) => {
                const li = document.createElement('li')
                li.innerText = `${a.nama} - Jurusan: ${a.jurusan}`
                listSiswa.appendChild(li)
            })
        }

        function searchSiswa() {
            const keyword = cariSiswa.value.toLowerCase().trim()
            const valueJurusan = filterJurusan.value
            const hasilFilterJurusan = peserta.filter((data) => {
                const namaCocok = data.nama.toLowerCase().includes(keyword)
                const jurusanCocok = (valueJurusan === "semua") || (data.jurusan === valueJurusan)

                return namaCocok && jurusanCocok
            })
            getSiswa(hasilFilterJurusan)
        }
        filterJurusan.addEventListener('change', searchSiswa)
        cariSiswa.addEventListener('input', searchSiswa)

        filterJurusan.addEventListener('change', (e) => {
            const selectedJurusan = e.target.value
            if (selectedJurusan === "semua") {
                getSiswa(peserta) // memunculkan data peserta
            } else {
                const hasilFilter = peserta.filter((a) => {
                    return a.jurusan === selectedJurusan
                })
                getSiswa(hasilFilter) // memunculkan data peserta yang sudah di filter
                console.log(`Hasil Filter ${hasilFilter}`)
            }
        })
        getSiswa(peserta);
    </script>
</body>

</html>
