<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: wheat;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans';
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid rgb(0, 0, 0);
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f5caf7;
            color: chocolate;
        }
    </style>
</head>
<body>
    <h2>Daftar Mahasiswa</h2>
    <table border="2" cellpadding="5" cellspacing="0">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>john.doe@example.com</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Jane Smith</td>
            <td>jane.smith@example.com</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Bob Johnson</td>
            <td>bob.johnson@example.com</td>
        </tr>
    </table>
    <br>
    <h2>Hasil Panen</h2>
    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th rowspan="2" bgcolor="#f5caf7" style="color: chocolate;">Bulan</th>
            <th colspan="2" bgcolor="#00ff80">Hasil Panen</th>
        </tr>
        <tr>
            <th>Padi</th>
            <th>Kacang</th>
        </tr>
        <tr>
            <td>Januari</td>
            <td>500 kg</td>
            <td>231 kg</td>
        </tr>
        <tr>
            <td>Februari</td>
            <td>342 kg</td>
            <td>423 kg</td>
        </tr>   
</body>
</html>
