<!-- event -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom dan Event || JS</title>
</head>

<body>
    <!-- elementTarget.addEventListener(); -->
    <h1>Form Sapaan</h1>
    <input type="text" id="nama" placeholder="Masukkan Nama">
    <button id="simpan">Klik</button>
    <button id="hapus">Hapus</button>
    <p id="sapaan">Halo Nama</p>
    <script>
        const heading = document.querySelector('h1')
        const nama = document.querySelector('#nama')
        const sapaan = document.querySelector('#sapaan')

        function prosesSapaan() {
            sapaan.innerText = `Halo Nama: ${nama.value}`
            nama.value = ""
        }

        document.getElementById('simpan').addEventListener('click', () => {
            // heading.innerText = "PPKD Jakarta Pusat"
            prosesSapaan()
        })

        nama.addEventListener('keyup', (e) => {
            if (e.key == "Enter") {
                prosesSapaan()
            }
        })

        document.getElementById('hapus').addEventListener('click', () => {
            // heading.innerText = ""
            prosesSapaan()
        })
    </script>
</body>

</html>
